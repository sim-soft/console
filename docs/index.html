<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simsoft Console — PHP CLI Framework Documentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

    <!-- SEO -->
    <meta name="description"
          content="Simsoft Console is a lightweight, Laravel-inspired PHP CLI framework built on Symfony Console. Features DI container, task scheduler, command locking, and reusable traits.">
    <meta name="keywords"
          content="PHP, CLI, console, command, Symfony, Laravel, scheduler, dependency injection, PSR-11, cron, artisan, framework, library">
    <meta name="author" content="Sim">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sim-soft.github.io/console/">

    <!-- Open Graph -->
    <meta property="og:title" content="Simsoft Console — PHP CLI Framework">
    <meta property="og:description"
          content="A lightweight, Laravel-inspired wrapper for Symfony Console with DI, scheduling, and reusable traits.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sim-soft.github.io/console/">
    <meta property="og:site_name" content="Simsoft Console">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Simsoft Console — PHP CLI Framework">
    <meta name="twitter:description"
          content="A lightweight, Laravel-inspired wrapper for Symfony Console with DI, scheduling, and reusable traits.">

    <!-- Geo -->
    <meta name="geo.region" content="MY">
    <meta name="geo.placename" content="Malaysia">
    <meta name="language" content="English">
    <meta name="distribution" content="global">

    <!-- Structured Data -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareSourceCode",
            "name": "Simsoft Console",
            "description": "A lightweight, Laravel-inspired PHP CLI framework built on Symfony Console",
            "codeRepository": "https://github.com/sim-soft/console",
            "programmingLanguage": "PHP",
            "license": "https://opensource.org/licenses/MIT",
            "runtimePlatform": "PHP 8.2+",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Cross-platform"
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/docsify-darklight-theme/3.1.1/style.min.css">
    <style>
        .logo-text {
            color: inherit !important;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
        name: 'Simsoft Console',
        nameLink: 'https://sim-soft.github.io/console/',
        repo: 'https://github.com/sim-soft/console',
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        routerMode: 'hash',
        search: {
            placeholder: 'Search documentation',
            noData: 'No results found',
            depth: 3,
        },
        darklightTheme: {
            defaultTheme: 'light',
            siteFont: 'Source Sans Pro, Helvetica Neue, Arial, sans-serif',
            codeFontFamily: 'JetBrains Mono, Roboto Mono, Monaco, courier, monospace',
            dark: {
                accent: '#E8960C',
                toogleBackground: '#1a1a2e',
                background: '#1a1a2e',
                textColor: '#e0e0e0',
                codeBackgroundColor: '#0d1117',
            },
            light: {
                accent: '#C47A08',
                toogleBackground: '#fff',
                background: '#fff',
                textColor: '#1a1a1a',
                codeBackgroundColor: '#f6f8fa',
            },
        },
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docsify-darklight-theme/3.1.1/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
<!-- Title prefix plugin -->
<script>
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function (hook) {
        hook.doneEach(function () {
            var title = document.querySelector('.markdown-section h1');
            document.title = 'Simsoft Console' + (title ? ' - ' + title.textContent : '');
        });
    });
</script>
</body>
</html>
